name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-prod-debug:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Clean Gradle Cache (แก้ปัญหา Cache ค้าง)
      run: rm -rf ~/.gradle/caches

    - name: Create local.properties
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Prod Debug APK
      run: ./gradlew :app:assembleProdDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-prod-debug
        path: app/build/outputs/apk/prod/debug/*.apk

    - name: Upload Wear OS Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-wear-prod-debug
        path: wearos/build/outputs/apk/prod/debug/*.apk
        if-no-files-found: ignore